<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style></head><body>
<title>触って覚える！ 手技・物品マスター</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
/* 「触って覚える！」シリーズの見た目。こどもの人工呼吸器トレーニング（ポップのテーマ）に合わせる。
   丸ゴシック・クリームの地・太い紺の輪郭線・下側の厚み（リップ）・章ごとの色の帯。
   図（iframe と物品の図）はライトテーマ固定で、色はそのまま。 */
:root{
  color-scheme:light;
  --body:#FFF3E4;
  --deck:linear-gradient(168deg,#FFEFD6 0%,#FFE0EC 46%,#E3ECFF 100%);
  --bg:#FFF3E4; --sheet:#FFFFFF; --panel2:#FFF8EE;
  --ink:#262745; --ink-2:#55577A; --ink-3:#767898; --faint:#A4A6C2; --line:#F0DFD0;
  --accent:#FF5E8A; --accent-t:#D63A6C; --accent-soft:#FFF0F4;   /* 進む・選択（-t は文字用の濃い色） */
  --blue:#5B7CFA; --blue-soft:#EEF2FF;
  --blood:#E0334F; --blood-soft:#FFECEF;
  --ok:#0B8F66; --ok-soft:#E8FBF3; --ok-br:#9FE9CE; --warn:#B86A00; --warn-soft:#FFF4DE;
  --steel:#9aa5b4; --clear:#F4F0FA;
  --gline:#2E2545; --glip:#C3B4D6;      /* 輪郭線と下側の厚み */
  --chap:#5B7CFA;
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"Barlow Semi Condensed","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --f-logo:"Dela Gothic One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  --r:18px;
}
/* 章ごとの色（ゲームの ch1〜ch4 と同じ） */
[data-chap="0"]{--chap:#4FA8FF} [data-chap="1"]{--chap:#12C48B} [data-chap="2"]{--chap:#8B6BFF} [data-chap="3"]{--chap:#FF5E8A}
*{box-sizing:border-box}
html{background:var(--body)}
html,body{min-height:100%}
body{margin:0;background:var(--deck) fixed;background-color:var(--body);color:var(--ink);font:500 15px/1.7 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;text-wrap:balance;margin:0;line-height:1.35}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}

/* 輪郭線＋厚みの板（ゲームの .lesson / .case / .mbtn と同じ文法） */
.sheet,.simcard,.list .item,.q .opts button,.choice button{border:3px solid var(--gline);box-shadow:0 4px 0 var(--glip)}

/* ---------- 共通の小物 ---------- */
.sndbtn{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid var(--gline);box-shadow:0 3px 0 var(--glip);cursor:pointer;padding:0}
.sndbtn:active{transform:translateY(3px);box-shadow:none}
.sndbtn svg{width:20px;height:20px}
.sndbtn[aria-pressed="false"]{background:#F1EEF6}

/* ---------- タイトル ---------- */
.title{position:fixed;inset:0;z-index:90;display:grid;place-items:center;overflow:auto;
  padding:max(12px,env(safe-area-inset-top,0px)) 16px max(12px,env(safe-area-inset-bottom,0px));
  /* bg_title_shugi.jpg（Codex で作る手技用の背景）があればそれを、無ければ人工呼吸器トレーニングの背景を使う */
  background:url("assets/bg_title_shugi.jpg") center/cover no-repeat,#FFF1E4 url("assets/bg_title.jpg") center/cover no-repeat}
.title::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(255,248,238,.30) 0%,rgba(255,240,244,.55) 55%,rgba(255,243,228,.82) 100%);pointer-events:none}
.title[hidden]{display:none}
.tstage{position:relative;width:min(440px,100%);display:flex;flex-direction:column;align-items:center;gap:10px}
.tlogo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:4px;text-align:center}
.tlogo .series{font:400 clamp(34px,10.5vw,50px)/1.1 var(--f-logo);color:#fff;letter-spacing:.02em;
  -webkit-text-stroke:7px var(--gline);paint-order:stroke fill;text-shadow:0 5px 0 rgba(46,37,69,.35);white-space:nowrap}
.tlogo .series .k1{color:#FFC53D}.tlogo .series .k2{color:#FF7FA4}.tlogo .series .k3{color:#4FD8B4}.tlogo .series .k4{color:#7FA0FF}
.tlogo .name{display:inline-block;font:800 clamp(20px,6vw,26px)/1.2 var(--f-display);color:#fff;letter-spacing:.12em;
  background:linear-gradient(180deg,#FF7FA4,#F0507F);border:3px solid var(--gline);border-radius:999px;padding:5px 22px 6px;
  box-shadow:0 4px 0 rgba(46,37,69,.3);text-shadow:0 2px 0 rgba(46,37,69,.45)}
.tlogo .logoimg{display:block;width:min(360px,92%);height:auto;filter:drop-shadow(0 5px 0 rgba(46,37,69,.25))}
.tlogo:not(.has-img) .logoimg{display:none} .tlogo.has-img .series,.tlogo.has-img .name{display:none}
.tlogo .tag{font-size:12px;font-weight:800;color:var(--ink-2);background:rgba(255,255,255,.85);border-radius:999px;padding:2px 12px}
.tcast{display:flex;align-items:flex-end;justify-content:center;gap:0;width:100%;height:clamp(150px,27vh,230px)}
.tcast img{display:block;height:100%;width:auto;filter:drop-shadow(0 8px 10px rgba(60,30,80,.28))}
.tcast .tm{height:58%;margin-right:-14px;transform:translateY(-22%) rotate(-4deg);animation:puku 3.6s ease-in-out infinite}
@keyframes puku{0%,100%{transform:translateY(-22%) rotate(-4deg) scale(.95)}45%{transform:translateY(-24%) rotate(-4deg) scale(1.05)}}
.tsay{position:relative;font-size:13.5px;line-height:1.6;font-weight:700;color:var(--ink);text-align:center;background:#fff;
  border:3px solid var(--gline);border-radius:18px;padding:9px 14px;max-width:100%;box-shadow:0 4px 0 rgba(46,37,69,.22)}
.tsay::after{content:"";position:absolute;left:58%;top:-10px;width:14px;height:14px;background:#fff;border-left:3px solid var(--gline);border-top:3px solid var(--gline);transform:rotate(45deg)}
.tmenu{display:flex;flex-direction:column;gap:9px;width:100%;margin-top:4px}
.tbtn{display:flex;align-items:center;gap:12px;text-align:left;padding:9px 14px 9px 9px;border-radius:20px;width:100%;
  background:#fff;border:3px solid var(--gline);box-shadow:0 5px 0 var(--glip);color:var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s}
.tbtn:active{transform:translateY(5px);box-shadow:none}
.tbtn img{flex:none;width:44px;height:44px}
.tbtn b{display:block;font-size:16px;font-weight:800;line-height:1.3}
.tbtn i{display:block;font-style:normal;font-size:12px;color:var(--ink-3);font-weight:700}
.tbtn.go{background:linear-gradient(180deg,#FFC24D,#FF8A3D);box-shadow:0 5px 0 #C4560F;color:#fff}
.tbtn.go b{text-shadow:0 2px 0 rgba(46,37,69,.4)} .tbtn.go i{color:#FFF4E4}
.tfoot{display:flex;align-items:center;gap:10px;width:100%;margin-top:4px;background:rgba(255,255,255,.88);border:3px solid var(--gline);border-radius:999px;padding:5px 5px 5px 14px}
.tprog{flex:1;height:12px;border-radius:999px;background:#F3E6EC;overflow:hidden;border:2px solid var(--gline)}
.tprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF5E8A,#FFB020 45%,#12C48B)}
.tpct{font:700 15px var(--f-mono);color:var(--ink-2);min-width:3em;text-align:right}
@media(max-height:680px){.tcast{height:120px}.tsay{display:none}.tbtn{padding:6px 12px 6px 7px}.tbtn img{width:36px;height:36px}.tbtn i{display:none}}

/* ---------- モーダル（ゲームのダイアログ） ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(50,30,60,.42);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadein .16s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.mbox{background:#fff;width:min(520px,100%);max-height:88%;overflow:auto;border:4px solid var(--gline);border-radius:26px;
  box-shadow:0 10px 0 rgba(46,37,69,.18),0 26px 60px rgba(80,40,90,.35);animation:pop .2s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{from{transform:scale(.94) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.mhead{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(180deg,#FF7FA4,#F0507F);border-bottom:4px solid var(--gline)}
.mhead h3{flex:1;color:#fff;font-size:17px;text-shadow:0 2px 0 rgba(46,37,69,.45)}
.mhead button{padding:5px 14px;border-radius:999px;background:#fff;border:3px solid var(--gline);font-weight:800;font-size:13px;box-shadow:0 3px 0 rgba(46,37,69,.35);cursor:pointer}
.mhead button:active{transform:translateY(3px);box-shadow:none}
.mbody{padding:16px;background:linear-gradient(180deg,#FFF9F3,#FFF1F5);font-size:14px}
.mbody p{margin:0 0 10px}

/* ---------- 達成の演出 ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}
#fx i{position:absolute;width:9px;height:14px;border-radius:2px;will-change:transform,opacity;animation:fall 1.5s cubic-bezier(.2,.6,.5,1) forwards}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0);opacity:1}100%{transform:translate3d(var(--dx),var(--dy),0) rotate(var(--rot));opacity:0}}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:130;pointer-events:none;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);
  background:linear-gradient(135deg,#FF5E8A,#FFB020);color:#fff;font-weight:800;font-size:15px;line-height:1.35;border:3px solid var(--gline);
  padding:6px 18px 6px 6px;border-radius:999px;box-shadow:0 10px 30px rgba(190,60,110,.35);animation:toast 2.2s ease-out forwards;text-shadow:0 2px 0 rgba(46,37,69,.35)}
.toast .tface{width:44px;height:44px;border-radius:50%;background:#E8FBF3;overflow:hidden;flex:none;border:2px solid var(--gline)}
.toast .tface img{display:block;width:100%;height:100%;object-fit:cover}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px) scale(.98)}}
/* マスコットの反応（正解・不正解・完了）。指の操作を邪魔しない */
.puku{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:110;width:92px;pointer-events:none;
  filter:drop-shadow(0 6px 8px rgba(60,30,80,.28));animation:pukuIn 1.6s cubic-bezier(.2,1.3,.5,1) forwards}
.puku img{display:block;width:100%;height:auto}
@keyframes pukuIn{0%{opacity:0;transform:translateY(40px) scale(.7)}14%{opacity:1;transform:none}82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(16px) scale(.92)}}

/* ---------- いぶき先生の吹き出し ---------- */
.coach{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.cav{flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;background:#E8FBF3;border:3px solid var(--gline);box-shadow:0 3px 0 var(--glip)}
.cav img{display:block;width:100%;height:100%;object-fit:cover}
.cbub{position:relative;flex:1;min-width:0;background:var(--panel2);border:2.5px solid var(--gline);border-radius:16px;padding:8px 12px 9px;font-size:14px;line-height:1.65}
.cbub::before{content:"";position:absolute;left:-9px;top:14px;width:12px;height:12px;background:var(--panel2);border-left:2.5px solid var(--gline);border-bottom:2.5px solid var(--gline);transform:rotate(45deg)}
.cwho{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--chap);margin-bottom:1px}
.cwho i{font-style:normal;color:#fff;background:var(--chap);border-radius:999px;padding:0 8px;font-size:10.5px}
.coach.ok .cbub{background:var(--ok-soft)} .coach.ok .cbub::before{background:var(--ok-soft)}
.coach.ng .cbub{background:var(--blood-soft)} .coach.ng .cbub::before{background:var(--blood-soft)}
.coach.ok .cwho{color:var(--ok)} .coach.ng .cwho{color:var(--blood)}

/* ---------- ヘッダー（手技の画面） ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;border-bottom:3px solid var(--gline);box-shadow:0 4px 0 rgba(46,37,69,.12)}
.top::before{content:"";display:block;height:5px;background:var(--chap)}
.top .wrap{padding-block:8px 10px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:8px}
.back{flex:none;border:3px solid var(--gline);background:#fff;border-radius:999px;padding:3px 12px 3px 9px;color:var(--ink);font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 3px 0 var(--glip)}
.back:active{transform:translateY(3px);box-shadow:none}
.bar h1{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;font:700 12px/1 var(--f-mono);letter-spacing:.04em;padding:5px 9px;border-radius:999px;background:var(--chap);color:#fff;border:2px solid var(--gline)}
.badge:empty{display:none}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tabs button{border:2.5px solid var(--gline);background:var(--panel2);border-radius:999px;padding:5px 4px;font-weight:800;font-size:14px;color:var(--ink-2);cursor:pointer;box-shadow:0 3px 0 var(--glip)}
.tabs button:active{transform:translateY(3px);box-shadow:none}
.tabs button[aria-selected="true"]{background:var(--chap);color:#fff;text-shadow:0 1px 0 rgba(46,37,69,.35)}

/* ---------- ホーム ---------- */
.home-hero{position:relative;margin-top:14px;padding:14px 120px 14px 16px;background:#fff;border:3px solid var(--gline);border-radius:22px;box-shadow:0 5px 0 var(--glip);overflow:hidden;min-height:150px}
.home-hero .eyebrow{font:400 15px/1.2 var(--f-logo);color:var(--accent-t);letter-spacing:.02em}
.home-hero h1{font-size:27px;margin-top:2px}
.home-hero p{color:var(--ink-2);margin:6px 0 0;font-size:13.5px;line-height:1.6}
.home-hero .hdoc{position:absolute;right:6px;bottom:-34px;height:190px;width:auto;pointer-events:none}
.hrow{display:flex;gap:8px;margin-top:10px;align-items:center}
.hbtn{border:3px solid var(--gline);background:var(--panel2);border-radius:999px;padding:3px 14px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 3px 0 var(--glip)}
.hbtn:active{transform:translateY(3px);box-shadow:none}
.bigprog{display:flex;align-items:center;gap:10px;margin-top:10px}
.bigprog .bar2{flex:1;height:16px;border-radius:999px;background:#fff;border:3px solid var(--gline);overflow:hidden}
.bigprog .bar2 i{display:block;height:100%;background:linear-gradient(90deg,#FF5E8A,#FFB020 45%,#12C48B)}
.bigprog .pct{font:700 18px var(--f-mono);flex:none}
.cat{margin-top:22px}
.cat h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;color:#fff;background:var(--chap);border:3px solid var(--gline);border-radius:16px;padding:7px 12px;box-shadow:0 4px 0 rgba(46,37,69,.22);margin-bottom:10px;text-shadow:0 1px 0 rgba(46,37,69,.35)}
.cat h2 .cdot{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--gline);flex:none}
.cat h2 .ccount{margin-left:auto;font:700 12px/1.4 var(--f-mono);color:var(--chap);background:#fff;border:2px solid var(--gline);border-radius:999px;padding:0 9px;text-shadow:none}
.list{display:flex;flex-direction:column;gap:9px}
.item{display:flex;align-items:center;gap:11px;padding:10px 12px 10px 10px;background:var(--sheet);border-radius:16px;text-align:left;width:100%;cursor:pointer;border-left-width:8px!important;border-left-color:var(--chap)!important;transition:transform .06s,box-shadow .06s}
.item:active{transform:translateY(4px);box-shadow:none!important}
.item[disabled]{cursor:default;opacity:.55}
.item .ic{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--chap) 14%,#fff);border:2px solid var(--gline)}
.item .tx{flex:1;min-width:0}
.item b{display:block;font-size:15px;font-weight:800;line-height:1.4}
.item small{display:block;color:var(--ink-3);font-size:12px;line-height:1.5;font-weight:700}
.item.done{background:linear-gradient(90deg,rgba(43,217,160,.14),#fff 70%)}
.pill{font:700 12px var(--f-mono);padding:3px 9px;border-radius:99px;border:2px solid var(--gline);color:var(--ink-2);white-space:nowrap;background:#fff}
.pill.go{background:var(--chap);color:#fff}
.progress{display:block;height:8px;border-radius:999px;background:#F3E6EC;margin-top:5px;overflow:hidden;border:1.5px solid var(--gline)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--chap),#FFC53D);width:0;transition:width .4s}

/* ---------- 手技の中身 ---------- */
.sec{padding-top:18px;display:flex;flex-direction:column;gap:16px}
.sheet{background:var(--sheet);border-radius:var(--r);padding:16px}
.sheet h2{font-size:17.5px}
.sheet .lead{color:var(--ink-2);font-size:13.5px;margin:4px 0 0}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.6}

/* device svg */
.device{margin:12px -6px 0;overflow-x:auto}
.device svg{display:block;width:100%;min-width:320px;height:auto}
.part{cursor:pointer}
.part:hover .pf,.part.on .pf{stroke:#1f4fd1;stroke-width:1.6}
.pf{stroke:var(--ink-2);stroke-width:.8}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{border:2.5px solid var(--gline);background:#fff;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 var(--glip)}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff}
.info{margin-top:12px;padding:12px;border-radius:14px;background:var(--blue-soft);border:2.5px solid var(--gline);min-height:84px}
.info b{display:block;font-family:var(--f-display);font-weight:800;font-size:15px}
.info p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.ptiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.ptile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px 8px;border:2.5px solid var(--gline);border-radius:14px;background:#f6f6f3;cursor:pointer;font-size:11.5px;font-weight:700;line-height:1.3;color:#1d2530;text-align:center;box-shadow:0 3px 0 var(--glip)}
.ptile img,.ptile .pnone{width:100%;aspect-ratio:4/3;object-fit:contain;display:block}
.ptile[aria-pressed="true"]{background:#E3EAFE;box-shadow:0 0 0 3px #1f4fd1}
.pover{display:block;width:100%;height:auto;margin-top:12px;border-radius:14px;background:#f6f6f3;border:2.5px solid var(--gline)}
.pfig{position:relative;margin-top:12px;border-radius:14px;background:#f6f6f3;overflow:hidden;border:2.5px solid var(--gline);-webkit-tap-highlight-color:transparent}
.pfig>svg,.pfig>img{display:block;width:100%;height:auto}
.pfig [data-k]{cursor:pointer}
.plabel{position:absolute;left:0;top:0;padding:3px 10px;border-radius:99px;background:#1f4fd1;color:#fff;font-size:12.5px;font-weight:800;white-space:nowrap;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.phint{position:absolute;right:8px;bottom:6px;font-size:11px;font-weight:700;color:#6b7380;pointer-events:none}
.info .pbig{display:block;width:100%;max-height:260px;object-fit:contain;margin:-2px 0 8px;border-radius:10px;background:#f6f6f3}
.toggle{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:3px solid var(--gline);background:#fff;color:var(--ink);border-radius:999px;padding:8px 18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--glip);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.solid{background:linear-gradient(180deg,#FFC24D,#FF8A3D);color:#fff;box-shadow:0 4px 0 #C4560F;text-shadow:0 2px 0 rgba(46,37,69,.4)}
.btn:disabled{opacity:.4;cursor:default;transform:none}

/* gauge table */
.gtable{width:100%;border-collapse:collapse;font-size:13px}
.gtable th{white-space:nowrap;font-weight:800;color:var(--ink-3);text-align:left;font-size:11.5px;padding:6px 4px;border-bottom:2px solid var(--line)}
.gtable td:nth-child(-n+3){white-space:nowrap}
.gtable.gen td{white-space:normal}.gtable.gen td:first-child{white-space:nowrap}.gtable.gen tr{cursor:default}
.gtable td{padding:8px 4px;border-bottom:1.5px solid var(--line);vertical-align:top}
.gtable td.mono{font-size:14px}
.gtable tr.sel td{background:var(--accent-soft)}
.gtable tr{cursor:pointer}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1.5px solid var(--gline)}
.tablewrap{overflow-x:auto;margin-top:10px}

/* checklist */
.check{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:2px dashed var(--line);font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok);flex:none}
.check small{display:block;color:var(--ink-3);font-size:12px}

/* steps */
.stepper{display:flex;gap:5px;margin-top:2px}
.stepper i{flex:1;height:10px;border-radius:999px;background:#F3E6EC;border:2px solid var(--gline)}
.stepper i.done{background:var(--chap)}
.stepper i.now{background:#FFC53D}
.stephead{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.stepno{font:700 13px var(--f-mono);color:#fff;background:var(--chap);border:2px solid var(--gline);border-radius:999px;padding:1px 10px;letter-spacing:.04em}
.stephead h2{font-size:20px}
.do{margin:10px 0 0;padding-left:1.3em}
.do li{margin:5px 0}
.do li::marker{font-family:var(--f-mono);font-weight:700;color:var(--chap)}
.upd{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--warn-soft);border:2.5px dashed #E0A040;font-size:13px}
.upd b{color:var(--warn)}
.simcard{border-radius:var(--r);overflow:hidden;background:var(--sheet)}
.simhead{display:flex;flex-direction:column;padding:10px 16px 9px;border-bottom:3px solid var(--gline);background:linear-gradient(180deg,#fff,var(--panel2))}
.simhead b{font-family:var(--f-display);font-weight:800;font-size:16px}
.simhead span{font-size:12.5px;color:var(--ink-3);font-weight:700}
.simcard iframe{display:block;width:100%;height:760px;border:0;background:#f2f2ef}
#stepbox{scroll-margin-top:130px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
.qask{margin-top:16px;font-weight:800;font-size:14.5px}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}
.choice button,.q .opts button{background:#fff;border-radius:14px;padding:9px 11px;text-align:left;font-size:13.5px;font-weight:700;cursor:pointer;border-width:2.5px!important;box-shadow:0 3px 0 var(--glip)!important;transition:transform .06s}
.choice button:active,.q .opts button:active{transform:translateY(3px);box-shadow:none!important}
.choice button.right,.q .opts button.right{background:var(--ok-soft);border-color:var(--ok)!important;color:var(--ok)}
.choice button.wrong,.q .opts button.wrong{background:var(--blood-soft);border-color:var(--blood)!important;color:var(--blood)}
.fb{min-height:1.4em}
.fbwrap[hidden]{display:none}

/* quiz */
.q{display:flex;flex-direction:column;gap:8px}
.q>b{font-size:14.5px}
.q .opts{display:flex;flex-direction:column;gap:8px}
.score{display:inline-block;margin-top:8px;font:700 20px var(--f-mono);color:var(--ink);background:var(--panel2);border:2.5px solid var(--gline);border-radius:999px;padding:0 14px}
.q .coach{margin-top:4px}

/* updates */
.chg{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:2px dashed var(--line)}
.chg:first-of-type{border-top:0;padding-top:4px}
.chg h3{font-size:15px}
.chg .row{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:6px;font-size:13.5px}
.chg .row span{font:600 11px var(--f-mono);padding-top:3px;color:var(--ink-3)}
.chg .row.now span{color:var(--ok)}
.chg .src{font-size:12px;color:var(--ink-3)}
.chg .src a{color:#3557D6;font-weight:700}
.kind{font:600 10.5px var(--f-mono);padding:2px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);vertical-align:2px;margin-left:6px}
.kind.add{background:var(--ok-soft);color:var(--ok)}
.kind.same{background:var(--clear);color:var(--ink-3)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}#fx{display:none}.toast,.puku{opacity:1}}
</style>

const SND = window.VentSound || { play(){}, enabled(){ return false; }, setEnabled(){} };

const sfx = (n) => { try{ SND.play(n); }catch(e){} };

// いぶき先生の吹き出し。mood: normal | happy | think | alert
const coach = (mood, html, cls, tag) => `<div class="coach ${cls||""}"><span class="cav"><img src="${ART("face_"+mood)}" alt=""></span><div class="cbub"><span class="cwho">いぶき先生${tag?`<i>${tag}</i>`:""}</span><div class="ctx">${html}</div></div></div>`;
const setCoach = (el, mood, cls) => { if(!el) return; el.className = "coach " + (cls||""); const im = el.querySelector(".cav img"); if(im) im.src = ART("face_"+mood); };
// マスコット（ぷくぷく）の反応。mood: happy | sad | excited
function puku(mood){
  document.querySelectorAll(".puku").forEach(x=>x.remove());
  const d=document.createElement("div"); d.className="puku"; d.setAttribute("aria-hidden","true");
  d.innerHTML=`<img src="${ART("mascot_"+mood)}" alt="">`; document.body.appendChild(d);
  setTimeout(()=>d.remove(), 1700);
}
const CONFETTI = ["#FF5E8A","#FFB020","#12C48B","#5B7CFA","#FF8A3D","#8B6BFF"];
function confetti(n){
  if(reduced()) return; const host=$("#fx"); if(!host) return;
  const w=innerWidth, cx=w/2, cy=innerHeight*0.34;
  for(let i=0;i<n;i++){ const p=document.createElement("i"), ang=Math.PI*2*i/n+Math.random()*.4, dist=90+Math.random()*190;
    p.style.left=Math.round(cx+(Math.random()-.5)*120)+"px"; p.style.top=Math.round(cy)+"px"; p.style.background=CONFETTI[i%CONFETTI.length];
    p.style.setProperty("--dx",Math.round(Math.cos(ang)*dist)+"px"); p.style.setProperty("--dy",Math.round(Math.abs(Math.sin(ang))*dist+180)+"px");
    p.style.setProperty("--rot",Math.round(Math.random()*900-450)+"deg"); p.style.animationDelay=(Math.random()*.18).toFixed(2)+"s"; host.appendChild(p); }
  setTimeout(()=>{ host.innerHTML=""; }, 2000);
}
function toast(msg, img){
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status");
  t.innerHTML=`<span class="tface"><img alt="" src="${img||ART("face_happy")}"></span><span></span>`; t.lastChild.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2300);
}
function celebrate(msg, jingle){ confetti(28); toast(msg); puku("excited"); if(!BGM.jingle(jingle||"chapter")) sfx("confirm"); }
// 音のオン・オフ（sound.js が localStorage に保存する。オフにすると BGM も止まる）

const SPK_OFF = '<path d="M4 9v6h4l5 4V5L8 9z" fill="#2E2545"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="#E0334F" stroke-width="2.4" stroke-linecap="round"/>';
const sndBtn = () => { const on=SND.enabled(); return `<button class="sndbtn" type="button" aria-pressed="${on}" aria-label="音" title="音 ${on?"オン":"オフ"}"><svg viewBox="0 0 24 24">${on?SPK_ON:SPK_OFF}</svg></button>`; };
document.addEventListener("click", (e)=>{ const b=e.target.closest&&e.target.closest(".sndbtn"); if(!b) return;
  SND.setEnabled(!SND.enabled()); BGM.refresh();
  document.querySelectorAll(".sndbtn").forEach(x=>x.outerHTML=sndBtn()); });
// 操作音：ボタンは柔らかい tap、タブ・部品の切り替えは硬い click（人工呼吸器トレーニングと同じ使い分け）。

document.addEventListener("keydown", (e)=>{ if(e.key!=="Enter"&&e.key!==" ") return; const b=e.target.closest&&e.target.closest("button"); if(!b||b.disabled||b.matches(QUIET)) return; sfx(b.matches(CLICKY)?"click":"tap"); }, true);

/* 触れる図（物品タブ）。parts/<id>/<name>.js が window.SHUGI_PFIG["parts/<id>/<name>.js"] に SVG 文字列を登録する。
   SVG の中の <g data-k="N"> が items[N]。タップするとその部品の色が変わり、名前が出る。読めないときは pic の静止画のまま。 */
window.SHUGI_PFIG = window.SHUGI_PFIG || {};
function loadPfig(src){
  return new Promise((ok,ng)=>{
    if(SHUGI_PFIG[src]) return ok(SHUGI_PFIG[src]);
    const sc=document.createElement("script"); sc.src=src;
    sc.onload=()=>SHUGI_PFIG[src]?ok(SHUGI_PFIG[src]):ng(); sc.onerror=ng; document.head.appendChild(sc);
  });
}
const pfigHTML=(s)=> s.pfig ? `<div class="pfig" data-src="${s.pfig}">${s.pic?`<img src="${s.pic}" alt="${s.h||""}">`:""}<span class="plabel" hidden></span><span class="phint">部品をタップ</span></div>`
  : (s.pic?`<img class="pover" src="${s.pic}" alt="${s.h||""}">`:"");
let pfigSeq=0;
function bindPfig(sec, items, pick){
  const box=sec.querySelector(".pfig"); let cur=-1;
  const api={ show(k){
    cur=k; const svg=box&&box.querySelector("svg"); if(!svg) return;
    const fid=svg.dataset.fid, lab=box.querySelector(".plabel");
    svg.querySelectorAll("[data-k]").forEach(g=>{ const on=+g.dataset.k===k; g.style.filter = on ? `url(#${fid})` : ""; g.style.opacity = on ? "" : ".55"; });
    const gs=[...svg.querySelectorAll(`[data-k="${k}"]`)];
    if(!gs.length||!items[k]){ lab.hidden=true; return; }
    box.querySelector(".phint").hidden=true;
    const br=box.getBoundingClientRect(); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    gs.forEach(g=>{ const r=g.getBoundingClientRect(); if(!r.width&&!r.height) return;
      x0=Math.min(x0,r.left); y0=Math.min(y0,r.top); x1=Math.max(x1,r.right); y1=Math.max(y1,r.bottom); });
    lab.textContent=items[k][0].replace(/（.*）/,""); lab.hidden=false;
    if(x0>x1) return;
    const w=lab.offsetWidth, hh=lab.offsetHeight, cx=(x0+x1)/2-br.left;
    let top=y0-br.top-hh-6; if(top<4) top=Math.min(br.height-hh-4, y1-br.top+6);
    lab.style.left=Math.max(4,Math.min(br.width-w-4,cx-w/2))+"px"; lab.style.top=top+"px";
  }};
  if(!box) return api;
  loadPfig(box.dataset.src).then(txt=>{
    const fid="pfhl"+(++pfigSeq);
    // 同じページに図が何枚あっても id がぶつからないように、図ごとに接頭辞をつける
    const ids=[...txt.matchAll(/\sid="([^"]+)"/g)].map(m=>m[1]);
    for(const id of ids){ const e=id.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
      txt=txt.replace(new RegExp(`(\\sid=")${e}"|(url\\(#)${e}\\)|(href="#)${e}"`,"g"),(m,a,b,c)=> a?`${a}${fid}-${id}"`: b?`${b}${fid}-${id})`:`${c}${fid}-${id}"`); }
    box.querySelector("img")?.remove(); box.insertAdjacentHTML("afterbegin", txt);
    const svg=box.querySelector("svg");
    svg.removeAttribute("width"); svg.removeAttribute("height"); svg.dataset.fid=fid;
    // 明るさを保ったまま青く染める（#1f4fd1 〜 淡い青）
    svg.insertAdjacentHTML("afterbegin", `<defs><filter id="${fid}" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.16 0.54 0.05 0 0.12  0.13 0.43 0.04 0 0.31  0.03 0.11 0.01 0 0.82  0 0 0 1 0" result="t"/><feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="d"/><feGaussianBlur in="d" stdDeviation="2" result="b"/><feFlood flood-color="#1f4fd1" flood-opacity=".55"/><feComposite in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="t"/></feMerge></filter></defs>`);
    svg.addEventListener("click",e=>{ const g=e.target.closest("[data-k]"); if(g&&items[+g.dataset.k]) pick(+g.dataset.k); });
    if(cur>=0) api.show(cur);
  }).catch(()=>{});
  addEventListener("resize",()=>{ if(cur>=0&&box.isConnected) api.show(cur); });
  return api;
}

/* データファイルの parts（配列）を描く。
   {type:"cards", h, lead, items:[[名前, 説明], ...]}       部品をタップして説明
   {type:"table", h, lead, head:[...], rows:[[...], ...], note}  セル "#rrggbb|ラベル" は色見本つき
   {type:"kit", h, lead, items:[[物品, 補足], ...]}         チェックリスト（端末に保存）
   {type:"text", h, lead, html}                             短い説明 */
function GenericParts(sections, id){
  const cell = (c) => { const m = /^(#[0-9a-fA-F]{3,8})\|(.*)$/.exec(String(c)); return m ? `<span class="sw" style="background:${m[1]}"></span>${m[2]}` : c; };
  const f = h(`<div class="sec">${sections.map((s,si)=>{
    const head = `<h2>${s.h}</h2>${s.lead?`<p class="lead">${s.lead}</p>`:""}`;
    if(s.type==="cards"){
      const pics = s.items.some(it=>it[2]);
      const big = (it)=> `${it[2]?`<img class="pbig" src="${it[2]}" alt="${it[0]}">`:""}<b>${it[0]}</b><p>${it[1]}</p>`;
      return `<section class="sheet" data-cards="${si}">${head}
      ${pfigHTML(s)}
      ${pics
        ? `<div class="ptiles">${s.items.map((it,k)=>`<button class="ptile" data-k="${k}" aria-pressed="${k===0}">${it[2]?`<img src="${it[2]}" alt="" loading="lazy">`:`<span class="pnone"></span>`}<span>${it[0].replace(/（.*）/,"")}</span></button>`).join("")}</div>`
        : `<div class="chips">${s.items.map((it,k)=>`<button class="chip" data-k="${k}" aria-pressed="${k===0}">${it[0].replace(/（.*）/,"")}</button>`).join("")}</div>`}
      <div class="info" role="status">${big(s.items[0])}</div></section>`;
    }
    if(s.type==="table") return `<section class="sheet">${head}<div class="tablewrap"><table class="gtable gen"><thead><tr>${s.head.map(x=>`<th>${x}</th>`).join("")}</tr></thead>
      <tbody>${s.rows.map(r=>`<tr>${r.map((c,k)=>`<td class="${k===0?"mono":""}">${k===0?`<b>${cell(c)}</b>`:cell(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${s.note?`<p class="note">${s.note}</p>`:""}</section>`;
    if(s.type==="kit") return `<section class="sheet">${head||"<h2>そろえる物品</h2>"}<p class="lead">チェックはこの端末に保存されます。</p>
      <div class="check">${s.items.map((k,i)=>`<label><input type="checkbox" data-kit="${id}:${si}:${i}" ${store.get("kit:"+id+":"+si+":"+i,false)?"checked":""}><span>${k[0]}<small>${k[1]||""}</small></span></label>`).join("")}</div></section>`;
    return `<section class="sheet">${head}${s.html?`<div style="margin-top:8px;font-size:14px">${s.html}</div>`:""}</section>`;
  }).join("")}</div>`);
  f.querySelectorAll("[data-cards]").forEach(sec=>{
    const items = sections[+sec.dataset.cards].items, info = sec.querySelector(".info");
    const pick = (k)=>{
      haptic(); sec.querySelectorAll(".chip,.ptile").forEach(x=>x.setAttribute("aria-pressed",String(+x.dataset.k===k)));
      const it = items[k]; info.innerHTML = `${it[2]?`<img class="pbig" src="${it[2]}" alt="${it[0]}">`:""}<b>${it[0]}</b><p>${it[1]}</p>`;
      fig.show(k);
    };
    const fig = bindPfig(sec, items, pick);
    sec.querySelectorAll(".chip,.ptile").forEach(c=>c.addEventListener("click",()=>pick(+c.dataset.k)));
  });
  f.querySelectorAll("[data-kit]").forEach(c=>c.addEventListener("change",()=>store.set("kit:"+c.dataset.kit,c.checked)));
  return f;
}

function Steps(){
  const f=h(`<div class="sec">
    <section class="simcard"><div class="simhead"><b>${cur().fig[1]}</b><span>${cur().figHint||"図をドラッグ、またはボタンで段階を進める"}</span></div>
      <iframe src="${cur().fig[0]}" title="${cur().fig[1]}" style="height:${cur().figH||760}px"></iframe></section>
    <section class="sheet" id="stepbox"></section></div>`);
  const box=$("#stepbox",f), id=state.view, STEPS=cur().steps, done=doneOf(id);
  // 図の高さを中身に合わせる（同一オリジンで読めるとき）。読めなければ figH のまま。
  const ifr=$(".simcard iframe",f);
  ifr.addEventListener("load",()=>{ try{
    const d=ifr.contentDocument, fit=()=>{ const hh=d.documentElement.scrollHeight; if(hh>200) ifr.style.height=hh+"px"; };
    fit(); new ResizeObserver(fit).observe(d.body);
  }catch(e){} });
  const draw=(scroll)=>{
    const i=Math.max(0,Math.min(STEPS.length-1,state.steps[id]||0)), s=STEPS[i];
    box.innerHTML=`<div class="stepper">${STEPS.map((_,k)=>`<i class="${k===i?"now":done[k]?"done":""}"></i>`).join("")}</div>
    <div class="stephead"><span class="stepno">STEP ${i+1}/${STEPS.length}</span><h2>${s.t}</h2></div>
    <ol class="do">${s.do.map(d=>`<li>${d}</li>`).join("")}</ol>
    ${coach("normal", s.why, "why", "なぜ")}
    ${s.upd?`<div class="upd"><b>最新の推奨：</b>${s.upd}</div>`:""}
    ${s.q?`<div><div class="qask">${s.q.ask}</div><div class="choice">${s.q.opts.map((o,k)=>`<button data-k="${k}">${o[0]}</button>`).join("")}</div><div class="fbwrap" hidden>${coach("think", '<span class="fb" role="status"></span>')}</div></div>`:""}
    <div class="nav"><button class="btn" data-go="-1" ${i===0?"disabled":""}>前へ</button><button class="btn solid" data-go="1">${i===STEPS.length-1?"完了":"次へ"}</button></div>`;
    if(s.q) box.querySelectorAll(".choice button").forEach(b=>b.addEventListener("click",()=>{
      const right=s.q.opts[+b.dataset.k][1]===1; b.classList.add(right?"right":"wrong"); haptic(right?"success":"error");
      box.querySelector(".fb").textContent=right?s.q.ok:s.q.ng;
      const fw=box.querySelector(".fbwrap"); fw.hidden=false; setCoach(fw.firstElementChild, right?"happy":"alert", right?"ok":"ng");
      sfx(right?"confirm":"miss"); puku(right?"happy":"sad");
    }));
    box.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{
      if(+b.dataset.go>0){ done[i]=1; haptic("success"); if(i===STEPS.length-1){ celebrate(`${cur().title}　手技を完了！`, "chapter"); state.tab="quiz"; render(); scrollTo(0,0); return; } sfx("confirm"); } else sfx("tap");
      state.steps[id]=i+(+b.dataset.go); save(); draw(true);
    }));
    if(scroll) box.scrollIntoView({behavior:"smooth",block:"start"});
  };
  draw(false);
  return f;
}

function Quiz(){
  let score=0, answered=0; const QUIZ=cur().quiz;
  const f=h(`<div class="sec"><section class="sheet"><h2>確認問題</h2>${coach("normal", cur().quizLead||"")}<div class="score" id="sc">0 / ${QUIZ.length}</div></section>
  ${QUIZ.map((q,i)=>`<section class="sheet q" data-q="${i}"><b>Q${i+1}. ${q.ask}</b><div class="opts">${q.opts.map((o,k)=>`<button data-k="${k}">${o[0]}</button>`).join("")}</div><div class="qwhy" hidden>${coach("think", q.why, "", "解説")}</div></section>`).join("")}</div>`);
  f.querySelectorAll("[data-q]").forEach(sec=>{
    const q=QUIZ[+sec.dataset.q];
    sec.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      if(sec.dataset.done) return; sec.dataset.done=1; answered++;
      const right=q.opts[+b.dataset.k][1]===1; if(right) score++;
      b.classList.add(right?"right":"wrong"); if(!right) sec.querySelectorAll("button").forEach(x=>{ if(q.opts[+x.dataset.k][1]) x.classList.add("right"); });
      const qw=sec.querySelector(".qwhy"); qw.hidden=false; setCoach(qw.firstElementChild, right?"happy":"think", right?"ok":"ng"); haptic(right?"success":"error");
      document.getElementById("sc").textContent=`${score} / ${QUIZ.length}`+(answered===QUIZ.length?"　おつかれさまでした":"");
      if(answered===QUIZ.length) celebrate(`確認問題 ${score} / ${QUIZ.length}　おつかれさまでした！`, "note");
      else { sfx(right?"confirm":"miss"); puku(right?"happy":"sad"); }
    }));
  });
  return f;
}

function News(){
  const UPDATES=cur().updates;
  return h(`<div class="sec"><section class="sheet"><h2>根拠と出典</h2>
    <p class="lead">手技とクイズの内容の根拠です。2026年10月時点の資料で確認しました。</p>
    ${UPDATES.map(u=>`<div class="chg"><h3>${u.h}</h3>
      <div>${u.now}</div>
      ${u.note?`<div class="note">${u.note}</div>`:""}
      <div class="src">出典：${u.src.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`).join("／")}</div></div>`).join("")}
  </section></div>`);
}
