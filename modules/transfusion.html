</style><section data-fig="1"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 1</span><span class="iso-plate-corner" data-corner="title">赤血球輸血 8歳</span><span class="iso-plate-corner" data-corner="hint">ドラッグで手順を進める・部品にふれると名前</span><span class="iso-plate-corner" data-corner="readout" data-readout>準備 · クレンメ 閉</span></div><div class="iso-stage" tabindex="0" role="slider" aria-label="輸血の手順：矢印キーで段階を進める" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 620 1279" role="img" aria-label="輸血セットで赤血球製剤を投与する。スタンドに赤血球液のバッグを掛け、輸血セットのびん針・濾過筒と濾過網・点滴筒・クレンメ・コネクターを順に示す。2人でベッドサイドで、本人の名乗り（名乗れない子は保護者）とリストバンド・バッグのラベルを照合し、クレンメを閉じてびん針を輸血口にまっすぐ根元まで刺す。点滴筒を押して濾過筒を血液で満たし、点滴筒は1/2まで。ライン先端まで満たして留置針につなぎ、8歳・25 kgの子の例で、最初の15分は半分の速度（約63 mL/時）でゆっくり始め、最初の5分はそばで観察し、15分後に再び観察してから指示の速度（例：125 mL/時）に上げる。副作用が出たらクレンメを閉じて中止し、留置針は残して生理食塩液で静脈路を保つ。"><defs><clipPath id="flevel"><path data-part="flevel" d="M0 0Z"/></clipPath><clipPath id="dlevel"><path data-part="dlevel" d="M0 0Z"/></clipPath>

/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>ラベルとリストバンド：2人で声に出して読み合わせる</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>点滴筒の滴：時計で数えて速度を合わせる（20滴≒1 mL）</span><span class="iso-key"><svg class="iso-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>クレンメ：手の届く所に。異常があればまず閉じる</span></span><span class="iso-caption">ベッドサイドに立った術者の目線で、段階ごとに視線の先を拡大している。目に入るのはバッグのラベル、透明な濾過筒と点滴筒の中の血液、落ちる滴、クレンメ、留置針の接続部。ラインの中をどれだけ流れているかは見えないので、点滴筒の滴を時計で数えて速度を決める。開始から5分はそばを離れず、子どもの顔色・訴え・刺入部を見る。うまく言えない子もいるので、保護者にも「いつもと違う」ことがあればすぐ知らせてもらう。15分後にもう一度確かめてから速度を上げ、発熱・悪寒・息苦しさ・血圧低下などがあればすぐクレンメを閉じる。寸法は一例。</span></figcaption></figure></section></main></div></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;

function pathOf(points, closed = false) {

const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {

let lastState = null;
function drawDrops(now) {

  const period = s.flow === "prime" ? 0.14 : s.flow === "fill" ? 0.12 : s.flow === "rate" ? 60 / (s.rate * PER_ML) : 0;
