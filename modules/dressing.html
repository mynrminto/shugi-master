.iso-plate .iso-svg{margin:0 auto}

.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

ep="5" aria-pressed="false">⑤ フォーム</button><button type="button" data-step="6" aria-pressed="false">⑥ アルギン酸</button><button type="button" data-step="7" aria-pressed="false">⑦ 交換</button><button type="button" data-step="8" aria-pressed="false">⑧ 感染</button></div><div class="vp-exu" role="group" aria-label="滲出液の量"><span>滲出液</span><button type="button" data-exu="0" aria-pressed="false">少ない</button><button type="button" data-exu="1" aria-pressed="true">中等量</button><button type="button" data-exu="2" aria-pressed="false">多い</button></div></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>見本台：いま使う被覆材の枠が光る</span><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>定規の赤い点：被覆材の縁（創の縁から25 mm）</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>被覆材の断面：フィルム・ハイドロコロイド・フォーム（3層）・アルギン酸塩</span></span><span class="iso-caption">手前半分を切り取った練習用の皮膚ブロック（厚さは一例）に直径30 mmの創がある。洗ってから深さと滲出液の量を見て選ぶ：少ない→フィルム・ハイドロコロイド、中等量→フォーム、多い・にじむ出血→アルギン酸塩をフィルムで覆う。「滲出液」ボタンで量を変えると、合わない組み合わせでは周りの皮膚がふやけ（浸軟）、縁から漏れる。被覆材は創の縁から2〜3 cm大きく貼り、ゲルが創より広がる・漏れる・はがれたら交換する。感染徴候があれば密閉しない。被覆材の厚さと器具の大きさは一例。</span></figcaption></figure></section><section data-fig="2"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 2</span><span class="iso-plate-corner" data-corner="title">術者の視点</span><span class="iso-plate-corner" data-corner="hint">ドラッグで進める・ふれると名前</span><span class="iso-plate-corner" data-corner="readout" data-readout>準備 · 創の大きさ・汚れ・周りの皮膚を見る</span></div><div class="iso-stage" t xray" aria-pressed="false">被覆材の下を透視</button><span class="iv-note">実際には見えない部分を半透明で表示</span></div></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>創面と滲出液：洗ったあと、深さと量を見て被覆材を選ぶ</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>被覆材の縁：創の縁から2〜3 cm外に来るように貼る</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>ゲル・しみ：不透明な被覆材では、これが交換の合図</span></span><span class="iso-caption">術者の目に入るのは、皮膚の表面と、上から見たすり鉢状の創、手元のシリンジや被覆材だけで、断面は見えない。洗浄は創面の地肌が見えるまで行い、深さと滲出液の量で被覆材を選ぶ。フィルムは透明で貼ったあとも創を観察できるが、ハイドロコロイドとフォームは不透明で創が見えなくなる。そのため白いゲルや表面のしみの広がり、縁からの漏れ・はがれを合図に交換する（「被覆材の下を透視」で中の様子を表示）。発赤・腫れ・膿など感染徴候があれば密閉しない。</span></figcaption></figure></section></main></div></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
