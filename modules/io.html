@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}

.iso-figure{margin:32px 0 36px}

.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

</style><section data-fig="1"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 1</span><span class="iso-plate-corner" data-corner="title">骨髄路 4歳 15kg</span><span class="iso-plate-corner" data-corner="hint">ドラッグで手技を進める・部品にふれると名前</span><span class="iso-plate-corner" data-corner="readout" data-readout>部位 · 粗面の約1 cm下、内側の平らな面</span></div><div class="iso-stage" tabindex="0" role="slider" aria-label="骨髄路確保：矢印キーで手技の段階を進める" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 620 543" role="img" aria-label="4歳・15 kgの子の骨髄路確保の練習パッド。脛骨近位（脛骨粗面の約1 cm下）を骨の長軸に直交する面で切り、手前半分を取り除いてある。断面は皮膚、薄い皮下組織、薄い皮質骨、骨髄腔（海綿骨）の順に重なり、右側の盛り上がりが脛骨の前縁。その約1 cm内側の平らな面に、15 mm（ピンク）の骨髄針を付けた電動ドライバーを垂直に当てる。骨端線は切った面より上にあり、そこを避ける。針先が骨に当たっても黒い目印が皮膚の上に見えることを確かめ、皮質骨をドリルで抜けて抵抗が消えたら止める。ドライバーと内筒を外し、固定具を付けて延長チューブをつなぎ、吸引してから生理食塩水でフラッシュする（小児2〜5 mL）。"><defs><clipPath id="syrfill"><path data-part="syrclip" d="M0 0Z"/></clipPath><clipPath id="marrowclip"><path d="M238.7 348.7L240.1 346.1L241.4 344.2L242.8 342.9L244.2 341.8L245.5 341L246.9 340.3L248.2 339.8L249.6 339.4L250.9 339.1L252.3 339L253.6 338.9L255 339L256.4 339.1L257.7 339.3L259.1 339.6L260.4 339.9L261.8 340.3L263.1 340.7L264.5 341.1L265.8 341.5L267.2 341.9L268.6 342.3L269.9 342.7L271.3 343.1L272.6 343.5L274 343.8L275.3 344.2L276.7 344.6L278 345L279.4 345.4L280.7 345.8L282.1 346.2L283.5 346.6L284.8 347L286.2 347.4L287.5 347.8L288.9 348.1L290.2 348.5L291.6 348.9L292.9 349.3L294.3 349.7L295.7 350.1L297 350.5L298.4 350.9L299.7 351.3L301.1 351.7L302.4 352.1L303.8 352.5L305.1 352.8L306.5 353.2L307.9 353.6L309.2 354L310.6 354.4L311.9 354.8L313.3 355.2L314.6 355.6L316 356L317.3 356.4L318.7 356.8L320 357.1L321.4 357.5L322.8 357.9L324.1 358.3L325.5 358.7L326.8 359.1L328.2 359.5L329.5 359.9L330.9 360.3L332.2 360.7L333.6 361.1L335 361.5L336.3 361.8L337.7 362.2L339 362.6L340.4 363L341.7 363.4L343.1 363.8L344 端線は避ける。15 mmの針で、骨に当てたとき黒い目印が皮膚の上に見えるか確かめる。皮質骨を抜けて抵抗が急に消えたらトリガーを離す。押し付けすぎない。脚は別の人が支える。意識がある子には、鎮痛を施設の手順で考え、保護者には何をするか短く伝える。</span></figcaption></figure></section><section data-fig="2"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 2</span><span class="iso-plate-corner" data-corner="title">術者の視点</span><span class="iso-plate-corner" data-corner="hint">ドラッグで手技を進める・部品にふれると名前</span><span class="iso-plate-corner" data-corner="readout" data-readout>粗面を触れ、約1 cm下の内側の平らな面に印</span></div><div class="iso-stage" tabindex="0" role="slider" aria-label="術者の視点：矢印キーで手技の段階を進める" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg f2" viewBox="0 0 620 805" role="img" aria-label="術者の視点。4歳の子の脛の横に立ち、電動ドライバーを垂直に構えて脛骨の平らな面を見下ろす。見えるのは皮膚とドライバーとハブ、黒い目印まで。皮膚より下の針先と骨は見えない。"><defs><clipPath id="syrfill-f2"><path data-part="syrclip" d="M0 0Z"/></clipPath><clipPath id="marrowclip-f2"><path d="M257.4 602.6L260.2 599.6L262.9 597.6L265.7 596.1L268.4 595L271.2 594.1L273.9 593.4L276.7 593L279.4 592.6L282.2 592.4L284.9 592.4L287.7 592.4L290.4 592.5L293.2 592.8L295.9 593.1L298.6 593.6L301.4 594.1L304.1 594.7L306.9 595.3L309.6 595.8L312.4 596.4L315.1 597L317.9 597.5L320.6 598.1L323.4 598.7L326.1 599.2L328.9 599.8L331.6 600.4L334.4 600.9L337.1 601.5L339.9 602.1L342.6 602.6L345.4 603.2L348.1 603.8L350.9 604.4L353.6 604.9L356.3 605.5L359.1 606.1L361.8 606.6L364.6 607.2L367.3 607.8L370.1 608.3L372.8 608.9L375.6 609.5L378.3 610L381.1 610.6L383.8 611.2L386.6 611.7L389.3 612.3L392.1 612.9L394.8 613.4L397.6 614L400.3 614.6L403.1 615.1L405.8 615.7L408.6 616.3L411.3 616.8L414 617.4L416.8 618L419.5 618.6L422.3 619.1L425 619.7L427.8 620.3L430.5 620.8L433.3 621.4L436 622L438.8 622.5L441.5 623.1L444.3 623.7L447 624.2L449.8 624.8L452.5 625.4L455.3 625.9L458 626.5L460.8 627.1L463.5 627.6L466.2 628.2L469 628.8L471.7 629.3L474.5 629.9L477.2 630.5L480 631L482.7 631.6L aria-pressed="false">⑦投与</button></div><div class="vp-row"><button type="button" class="vp-xray" aria-pressed="false">皮下を透視</button><span class="vp-note">実際には見えない部分を半透明で表示</span></div></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>黒い目印：針先が骨に当たったとき皮膚の上に見えていれば、長さが足りている</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>ドライバーとハブ：骨面に垂直に保つ。抵抗が抜けた感触で止める</span><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>刺入部の印と周りの皮膚：フラッシュで腫れたら漏れている。皮下は見えない（「皮下を透視」で表示）</span></span><span class="iso-caption">術者に見えるのは、皮膚の表面とドライバー、ハブと黒い目印までで、針先が皮質骨を抜けたかどうかは目では分からない。合図は手に伝わる抵抗の変化で、抵抗がふっと抜けたらトリガーを離す。内筒を抜いたら針がぐらつかずに立っているかを見て、吸引とフラッシュのあとは刺入部の周りが腫れてこないかを見続ける。</span></figcaption></figure></section></main></div></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);
    });
    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
    const top = ring.map(([x, y]) => iso([x, y, z + height], projection));
    const bottom = ring.map(([x, y]) => iso([x, y, z], projection));
    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))
        outline.push(pathOf(run.map((index) => top[index])));
    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {
            if (facing[(index + count - 1) % count] !== facing[index])
                outline.push(pathOf([top[index], bottom[index]]));
        }
    }
    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
