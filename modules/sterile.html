3" aria-pressed="false">③ 手前</button><button type="button" data-step="4" aria-pressed="false">④ 手袋の<wbr>包み</button><button type="button" data-step="5" aria-pressed="false">⑤ 利き手</button><button type="button" data-step="6" aria-pressed="false">⑥ 反対の手</button><button type="button" data-step="7" aria-pressed="false">⑦ 保つ</button><button type="button" data-step="8" aria-pressed="false">⑧ 汚染<wbr>したら</button></div></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="dashed" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>赤い破線：縁から2.5 cmの内側だけが清潔</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>開く順：奥 → 左右 → 手前</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>手袋の折り返し：素手は内側、手袋の手は外側</span></span><span class="iso-caption">開く前に、子どもと保護者に説明し、体位と支え方を決めておく。処置台は腰より高く、平らで乾いた所で、子どもの手足が届かない側に置く。手指衛生のあと、滅菌パックは奥の角から開き、次に左右、最後に手前を開く。こうすると開いた清潔野の上を腕で横切らずにすむ。開いた包布の縁から約2.5 cmは不潔とみなす。手袋は内包装を外側の縁だけ持って開き、利き手は折り返しの内側だけをつまんで着け、反対の手は手袋をした指を折り返しの下に入れて着ける。着けたら手は腰より上、清潔野の上、視界の中に。清潔でない物に触れたら、すぐ手袋を替える。寸法は一例。</span></figcaption></figure></section><section data-fig="2"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 2</span><span class="iso-plate-corner" data-corner="title">術者の視点</span><span class="iso-plate-corner" data-corner="hint">ドラッグで進める・ふれると名前</span><span class="iso-plate-corner" data-corner="readout" data-readout>準備 · 包装の破れ・湿り・期限</span></div><div class="iso-stage" tabindex="0" role="slider" aria-label="術者の視点：矢印キーで段階を進める" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0"><svg x g></g></svg></div><div class="vp-controls"><input type="range" id="phase2" min="0" max="8" step="0.001" value="0" aria-label="術者の視点：手技の段階"><div class="vp-steps" role="group" aria-label="段階"><button type="button" data-step="0" aria-pressed="true">準備</button><button type="button" data-step="1" aria-pressed="false">① 奥</button><button type="button" data-step="2" aria-pressed="false">② 左右</button><button type="button" data-step="3" aria-pressed="false">③ 手前</button><button type="button" data-step="4" aria-pressed="false">④ 手袋の<wbr>包み</button><button type="button" data-step="5" aria-pressed="false">⑤ 利き手</button><button type="button" data-step="6" aria-pressed="false">⑥ 反対の手</button><button type="button" data-step="7" aria-pressed="false">⑦ 保つ</button><button type="button" data-step="8" aria-pressed="false">⑧ 汚染<wbr>したら</button></div></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="dashed" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>清潔野の縁：ここから先へは素手も袖も入れない</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>手袋の折り返し：どこに触れているかを目で確かめる</span><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>赤：清潔野の外に触れた手袋。替えるまで清潔野に戻さない</span></span><span class="iso-caption">術者の目に入るのは、手元の包布と手袋、自分の手だけ。包布はいつも角の外側をつまみ、開いた清潔野の上に腕を出さない。手袋は折り返し（カフ）が手前に来る向きで開き、素手で触れてよいのは折り返しの内側だけ、手袋をした手で触れてよいのは手袋の外側だけ、と目で確かめながら進める。着けたら手を腰より上・清潔野の上に置き、清潔野から目を離さない、背を向けない。触れたかどうか迷ったら、不潔とみなして替える。</span></figcaption></figure></section></main></div></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);

    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))
        outline.push(pathOf(run.map((index) => top[index])));
