><button type="button" data-step="8" aria-pressed="false">⑧ 提出</button></div></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>翼状針（23G）：チューブ内の空気は最初のボトルに入る</span><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>ボトルの赤線：2 mL（小児用ボトルの最適量 1〜3 mL の一例）</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>手前＝セット1、奥＝セット2（別の部位から）。どちらも小児用ボトル1本。キャップの色は一例</span><span class="iso-key"><svg class="iso-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>青い膜：消毒した範囲。乾いたら触れない</span></span><span class="iso-caption">5歳・18 kgの子の一例。腕を台に載せ、ボトルは穿刺部より低い台に立てる（実際は保護者の膝の上で、腕だけを支えることが多い）。キャップを外してゴム栓をアルコールで拭き、皮膚を消毒して乾かしてから23Gの翼状針で刺す。ホルダーは小児用ボトル→他の採血管の順に差し、ボトルには表示の範囲の量を入れて上限を超えない。2セット目は別の部位を新たに穿刺して採る。ボトルにはラベルを貼り、冷蔵せず室温ですぐ提出する。パッドの寸法とボトルの量は一例。</span></figcaption></figure></section><section data-fig="2"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 2</span><span class="iso-plate-corner" data-corner="title">術者の視点</span><span class="iso-plate-corner" data-corner="hint">ドラッグで手技を進める・部品にふれると名前</span><span class="iso-plate-corner" data-corner="readout" data-readout>準備 · ボトル2セットと穿刺部を見渡す</span></div><div class="iso-stage" tabindex="0" role="slider" aria-label="術者の視点：矢印キーで手技の段階を進める" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg f2svg" viewBox="0 0 620 470" role="img" aria-label="術者の視点。腕の向こう側から、子どもの前腕のパッドと手前のボトルを見下ろす。見えるのは皮膚の表面、翼状針の翼とチューブ、ホルダー、ボトルの液面だけで、皮膚の下の針先と静脈は見えない。逆血はチューブで、採血量はボトルの目盛りで確かめる。"><g data-name="base"><path class="iso-halo" d="M-52.7 416L-52.5 413.9L-51.8 411.9L42 214.5L43.2 212.6L44.8 210.9L46.8 209.6L49.1 208.5L51.7 207.8L54.4 207.5L57.1 207.6L59.7 208.1L809.5 417.2L812 418.1L814.1 419.3L815.9 420.9L817.3 422.7L818.2 424.6L818.6 426.7L818.6 437.4L818.5 439.5L817.8 441.5L724 638.9L722.8 640.8L721.2 642.5L719.2 643.8L716.8 644.9L714.3 645.6L711.6 645.9L708.9 645.8L706.2 645.3L-43.6 436.2L-46 435.3L-48.2 434.1L-50 432.5L-51.4 430.7L-52.3 428.8L-52.7 426.7Z"/><g class="iso-solid"><path class="iso-fill" d="M57.2 250L57.2 248.1L57.8 246.2L58.9 244.5L60.5 243.1L62.5 241.9L64.7 241.1L67.1 240.7L69.6 240.7L72 241.2L74.3 242L76.2 243.2L77.7 244.7L78.7 246.4L79.3 248.3L79.3 249.7L79.2 251.6L78.7 253.5L77.5 255.2L76 256.6L74 257.8L71.8 258.6L69.3 259L66.9 259L64.5 258.5L62.2 257.7L60.3 256.5L58.8 255L57.7 253.3L57.2 251.4Z"/><path class="iso-shade" data-shade="0" d="M79.3 249.7L79.2 251.6L79.2 250.2L79.3 248.3ZM79.2 251.6L78.7 253.5L78.7 252L79.2 250.2ZM78.7 253.5L77.5 255.2L77.5 253.7L78.7 252ZM77.5 255.2L76 256.6L76 255.2L77.5 253.7ZM76 256.6L74 257.8L74 256.4L76 255.2Z"/><path class="iso-shade" data-shade="1" d="M74 257.8L71.8 258.6L71.8 257.2L74 256.4ZM71.8 258.6L69.3 259L69.3 257.6L71.8 257.2Z"/><path class="iso-shade" data-shade="2" d="M69.3 259L66.9 259L66.9 257.6L69.3 257.6ZM66.9 259L64.5 258.5L64.5 257.1L66.9 257.6ZM64.5 258.5L62.2 257.7L62.2 256.3L64.5 257.1Z"/><path class="iso-shade" data-shade="3" d="M62.2 257.7L60.3 256.5L60.3 255.1L62.2 256.3ZM60.3 256.5L58.8 255L58.8 253.6L60.3 255.1ZM58.8 255L57.7 253.3L57.7 251.8L58.8 253.6ZM57.7 253.3L57.2 251.4L57.2 250L57.7 251.8Z"/><path class="iso-top" d="M57.8 246.2L58.9 244.5L60.5 243.1L62.5 241.9L64.7 241.1L67.1 240.7L69.6 240.7L72 241.2L74.3 242L76.2 243.2L77.7 244.7L78.7 246.4L79.3 248.3L79.2 250.2L78.7 252L77.5 253.7L76 255.2L74 256.4L71.8 257.2L69.3 257.6L66.9 257.6L64.5 257.1L62.2 256.3L60.3 255.1L58.8 253.6L57.7 251.8L57.2 250L57.2 248.1Z const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {

const tenth = (value) => {

function pathOf(points, closed = false) {

const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {

function runsOf(flags, want) {
