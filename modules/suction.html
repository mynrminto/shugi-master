 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>手元：調節口と親指、カテーテルの目盛り</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>透視：気管の中のカテーテルと分泌物（実際は見えない）</span></span><span class="iso-caption">子どもの頭側から見下ろした同じ場面。気管の中のカテーテルの先は見えないので、深さはカテーテルの目盛りを枕元に記録した長さに合わせて決め、抵抗に当たるまで入れない。陰圧は調節口をふさいでいる間だけかける。吸引中は分泌物の性状、圧力計、SpO2と秒数を見続け、終わったら呼吸音と SpO2 の回復を確かめる。</span></figcaption></figure></section></main></div></main><script type="module">const AZIMUTH = 45;
