k="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>穿刺針・ワイヤー・カテーテルの太さと長さは一例（指示の物を使う）</span></span><span class="iso-caption">10歳・30 kgの子の頸部ファントムを内頸静脈の中心で縦に切り、外側半分を外してある。子どもの静脈は浅く細く、総頸動脈はその内側にある。エコー短軸で静脈と動脈を見分け、細い穿刺針を45°で刺して逆血を確かめる。ワイヤーを入れたらエコーで静脈内を確かめてからダイレーターを使い、カテーテルを11 cm（10歳の目安の一例）まで進めてワイヤーを抜く。実際は鎮静し、肩枕と頭低位をとって、モニター装着下に行う。組織の厚さ・器具の太さは一例。</span></figcaption></figure></section><section data-fig="2"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 2</span><span class="iso-plate-corner" data-corner="title">術者の視点</span><span class="iso-plate-corner" data-corner="hint">ドラッグで手技を進める・部品にふれると名前</span><span class="iso-plate-corner" data-corner="readout" data-readout>準備 · 覆布の穴から頸部と画面</span></div><div class="iso-stage" tabindex="0" role="slider" aria-label="術者の視点：矢印キーで手技の段階を進める" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 620 520" role="img" aria-label="10歳の子の中心静脈カテーテルを術者の目線で見た図。術者は患者の頭側に立ち、手元の穿刺針とシリンジ越しに頸部の皮膚と奥のエコー画面を見る。皮膚より下の静脈・動脈・針先は見えないので、エコー画面とシリンジの逆血で判断する。"><g transform="matrix(-1 0 0 1 620 0)"><g data-part="cam"><defs><clipPath id="flash_2"><path data-part="flashClip" d="M0 0Z"/></clipPath><clipPath id="above2_2"><path d="M-1743.6 -1878.9L335.7 313.4L335.7 2596.2L2353.6 4723.8L2353.6 243.2L-1743.6 -4076.6Z"/></clipPath></defs><g data-name="base"><path class="iso-halo" d="M83.7 220.5L83.8 219.2L84.2 218L84.9 216.8L86 215.8L87.3 214.9L270.5 112.9L272 112.2L273.6 111.8L275.3 111.6L277 111.7L278.7 112L280.2 112.6L281.6 113.4L282.7 114.4L534.7 380L535.5 381.2L536.1 382.4L536.3 383.7L536.3 390.4L536.2 391.7L535.8 393L535.1 394.2L534 395.2L532.7 396.1L349.5 498.1L348 498.7L346.4 499.2L344.7 499.3L343 499.3L341.3 498.9L339.8 498.4L338.4 497.6L337.3 496.6L85.3 230.9L84.5 229.8L83.9 228.6L83.7 2 " aria-pressed="false">⑦ 固定</button><button type="button" data-step="8" aria-pressed="false">⑧ X線</button></div><div class="iv-row"><button type="button" class="iv-xray" aria-pressed="false">皮下を透視</button><span class="iv-note">実際には見えない部分を半透明で表示</span></div></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>シリンジの逆血：針先が静脈に入ったことを手元で知る合図</span><span class="iso-key"><svg class="iso-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>エコー画面：針先・GW・カテーテルが静脈の中にあるか</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>皮膚より下の静脈と針先：直接は見えない（「皮下を透視」で表示）</span></span><span class="iso-caption">術者は患者の頭側に立ち、手元の針とシリンジ、その先の頸部の皮膚、奥のエコー画面を見ている。皮膚より下の静脈・動脈・針先は目に入らない。だから針先の位置はエコー画面とシリンジの逆血で判断し、GWが静脈の中にあることも画面で確かめてから皮膚を切って拡張する。GWは抜くまで手から離さない。カテーテルを進める前にGWの後端がハブから出たのを見る。子どもは鎮静して動かないようにし、家族は控室で待つ。覆布や体の大きさは縮めている。寸法は一例。</span></figcaption></figure></section></main></div></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
