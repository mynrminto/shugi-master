@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}

  const lift = t < 1 ? 1 - span(t, 0.6, 1) : t < 3 ? 0 : 2.5 * span(t, 3, 3.35);
  const dirt = 1 - span(t, 0.2, 0.85);
  const wipe = t < 0.15 ? 0 : t < 0.95 ? 1 : 1 - span(t, 0.95, 1);
  const a = AGENTS[agent];
  const sec = a.sec * lin(t, 3, 4);
  return { u, lift, dirt, wipe, sec, dry: sec / a.sec, needle: span(t, 4.15, 4.85), syr: span(t, 4, 4.3) };
}
function draw() {
  root.dataset.agent = agent;

  const r = s.u > 0.001 ? Math.min(R_PAINT + HEAD.d * 0.35, R_PAINT * s.u + HEAD.d * 0.45) : 0;
  film.setAttribute("d", r ? pathOf(pts(halfDisc(r, TOP + 0.15)), true) : "M0 0Z");
  filmEdge.setAttribute("d", r ? pathOf(pts([[-r, 0, TOP], [r, 0, TOP], [r, 0, TOP + 0.9], [-r, 0, TOP + 0.9]]), true) : "M0 0Z");
  const wet = r * Math.sqrt(1 - s.dry);
  sheen.setAttribute("d", wet > 0.5 ? pathOf(pts(halfDisc(wet, TOP + 0.2)), true) : "M0 0Z");
  sheen.style.opacity = String(agent === "etoh" ? 0.55 : 0.32);
  // trail of the sponge centre
  if (s.u > 0.002 && t < 3.6) { const tr = []; const n = Math.ceil(s.u * 160); for (let i = 0; i <= n; i++) { const [x, y] = headAt(s.u * i / n); tr.push([x, y, TOP + 0.3]); } trail.setAttribute("d", pathOf(pts(tr))); trail.style.opacity = String(0.8 * (1 - span(t, 3.1, 3.6))); } else trail.setAttribute("d", "M0 0");
  // applicator: waits above the centre, paints, then lifts away
  const [hx, hy] = s.u > 0 ? headAt(s.u) : [0, YMAX];
  app.setAttribute("transform", translateAlong(P, [hx, hy, 40 * s.lift]));
  app.style.opacity = String(t < 3.2 ? 1 : 1 - span(t, 3.2, 3.42));
  // gauze wipes the smudge, then leaves
  const gw = lin(t, 0.15, 0.95);
  gauze.style.opacity = String(s.wipe);
  gauze.setAttribute("transform", translateAlong(P, [SMUDGE.x + Math.sin(gw * Math.PI * 6) * 14 + gw * 10, SMUDGE.y + Math.cos(gw * Math.PI * 4) * 4, 0]));
  smudge.style.opacity = String(s.dirt);
  // germs: killed while the film stays wet (only inside the painted area)
  germs.forEach((el, i) => {
    const g = GERMS[i];
    const inside = Math.hypot(g.x, g.y) <= r + 0.5 && (g.deep ? Math.abs(g.x) <= r : g.y <= 0);
    const gone = inside ? clamp((s.dry - g.kill) / 0.12, 0, 1) : 0;
    el.style.opacity = String(1 - gone);
  });
  // timer
  hand.setAttribute("d", pathOf(pts([dialPt(0, 0), dialPt(s.sec, TIMER.r - 10)])));
  mark.setAttribute("d", pathOf(pts([dialPt(a.sec, TIMER.r - 16), dialPt(a.sec, TIMER.r - 4)])));
  bottles.forEach((b) => { if (b.dataset.bottle === agent) b.dataset.on = ""; else delete b.dataset.on; });
  // syringe
  syr.style.opacity = String(s.syr);
  syr.setAttribute("transform", translateAlong(P, [B[0] * PRE * (1 - s.needle), 0, B[2] * PRE * (1 - s.needle)]));
  const tipZ = TIP[2] + B[2] * PRE * (1 - s.needle);
  // readout
  let text;
  if (t < 0.002) text = "準備 · " + a.name;
  else if (t < 1.0005) text = s.dirt > 0.02 ? "① 汚れを落とす" : "① 汚れを落とした · 水分をふく";
  else if (t < 3.0005) text = (t < 2.0005 ? "② 中心から外へ" : "③ 十分な範囲") + " · 塗った半径 " + (r / M).toFixed(0) + " mm";
  else if (t < 4.0005) {
    const ok = s.dry >= 0.999;
    text = "④ " + (ok ? "乾いた " : "乾燥 ") + mmss(s.sec) + " / " + mmss(a.sec) + (ok ? " · 穿刺できる" : a.alcohol ? " · 火気厳禁" : " · まだ");
  } else text = tipZ > TOP ? "⑤ 乾いてから穿刺 · 部位に触れない" : "⑤ 穿刺 · 深さ " + ((TOP - tipZ) / M).toFixed(1) + " mm";
  if (typeof OPTEXT === "function") text = OPTEXT(t, text);
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuenow", t.toFixed(2));
  stage.setAttribute("aria-valuetext", text);
  if (!dragging && document.activeElement !== range) range.value = t.toFixed(3);
  const here = Math.round(clamp(t, 0, LAST));
  steps.forEach((b, i) => b.setAttribute("aria-pressed", String(i === here)));
  agentBtns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.agent === agent)));
}
let t = 0, target = 0, frame = 0, last = 0, visible = false, dragging = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;

  frame = visible && t !== target ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
const steer = (next, now) => { target = clamp(next, 0, LAST); if (now) t = target; draw(); run(); };
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
let startX = 0, startT = 0;
stage.addEventListener("pointerdown", (e) => { dragging = true; startX = e.clientX; startT = target; stage.setPointerCapture(e.pointerId); stage.dataset.drag = ""; });
stage.addEventListener("pointermove", (e) => { if (!dragging) return; const box = svg.getBoundingClientRect(); steer(startT + ((e.clientX - startX) / (box.width * 0.8)) * LAST, true); });
const release = () => { dragging = false; delete stage.dataset.drag; };
const tip = document.createElement("div"); tip.className = "vp-tip"; tip.hidden = true; tip.setAttribute("role", "status"); stage.appendChild(tip);
let hot = null;
const setHot = (id) => { if (hot === id) return; if (hot) svg.querySelectorAll('[data-name="' + hot + '"]').forEach((el) => el.classList.remove("hot")); hot = id; if (hot) svg.querySelectorAll('[data-name="' + hot + '"]').forEach((el) => el.classList.add("hot")); };
const hideTip = () => { tip.hidden = true; setHot(null); };
const showTipAt = (x, y) => {
  const el = document.elementFromPoint(x, y);
  const g = el && el.closest && el.closest("[data-name]");
  if (!g || !svg.contains(g)) return hideTip();
  const id = g.dataset.name, info = PARTS[id];
  if (!info) return hideTip();
  if (tip.dataset.id !== id) { tip.innerHTML = "<b>" + info[0] + "</b>" + info[1]; tip.dataset.id = id; }
  tip.hidden = false; setHot(id);
  const box = stage.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let left = x - box.left + 14, top = y - box.top + 16;
  if (left + w > box.width - 4) left = x - box.left - w - 14;
  if (top + h > box.height - 4) top = y - box.top - h - 12;
  tip.style.transform = "translate(" + Math.max(4, left) + "px," + Math.max(4, top) + "px)";
};
stage.addEventListener("pointermove", (e) => { if (dragging) { if (Math.abs(e.clientX - startX) > 4) hideTip(); return; } if (e.pointerType === "mouse") showTipAt(e.clientX, e.clientY); });
stage.addEventListener("pointerleave", () => { if (!dragging) hideTip(); });
stage.addEventListener("pointerup", (e) => { if (Math.abs(e.clientX - startX) < 4 || e.pointerType === "mouse") showTipAt(e.clientX, e.clientY); });
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);
range.addEventListener("input", () => steer(Number(range.value), true));
steps.forEach((b, i) => b.addEventListener("click", () => steer(i)));
agentBtns.forEach((b) => b.addEventListener("click", () => { agent = b.dataset.agent; draw(); }));
stage.addEventListener("keydown", (e) => {
  const here = Math.round(target); let to = null;
  if (e.key === "ArrowRight" || e.key === "ArrowUp") to = Math.min(LAST, here + 1);
  if (e.key === "ArrowLeft" || e.key === "ArrowDown") to = Math.max(0, here - 1);
  if (e.key === "Home") to = 0;
  if (e.key === "End") to = LAST;
  if (to === null) return;
  e.preventDefault(); steer(to);
});
draw();

}
