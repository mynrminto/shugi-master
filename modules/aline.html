架空の一例。寸法と画面は一例・模式。</span></figcaption></figure></section><section data-fig="2"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 2</span><span class="iso-plate-corner" data-corner="title">術者の視点</span><span class="iso-plate-corner" data-corner="hint">ドラッグで手技を進める・部品にふれると名前</span><span class="iso-plate-corner" data-corner="readout" data-readout>準備 · 必要な物を手元にそろえる</span></div><div class="iso-stage" tabindex="0" role="slider" aria-label="術者の視点：矢印キーで手技の段階を進める" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 620 520" role="img" aria-label="10歳の子の動脈圧ラインを術者の目線で見た図。術者は患者の手の側に座り、手元のカテーテルのハブ越しに手関節を見て、その奥のトランスデューサーとモニターを見る。橈骨動脈と針先は皮膚の下で見えないので、拍動とハブの逆血を合図にする。"><g data-part="cam"><defs><clipPath id="above2"><path d="M-2946 4910.3L309.6 3384.9L309.6 391.9L363 361.6L434.6 330L434.6 3326.4L3631 1828.8L3631 -4138L-2946 -1056.4Z"/></clipPath></defs><g data-name="base"><path class="iso-halo" d="M129 377.1L129.2 375.8L129.7 374.5L130.6 373.4L131.8 372.3L133.3 371.5L363.5 263.6L365.2 263L367.1 262.6L369 262.4L371 262.5L372.9 262.9L374.7 263.5L376.2 264.3L377.5 265.3L489.2 372L490.1 373.1L490.7 374.4L491 375.7L491 384.6L490.8 386L490.3 387.2L489.4 388.4L488.2 389.4L486.7 390.3L256.5 498.1L254.8 498.8L252.9 499.2L251 499.4L249 499.3L247.1 498.9L245.3 498.3L243.8 497.5L242.5 496.5L130.8 389.8L129.9 388.6L129.3 387.4L129 386.1Z"/><g class="iso-solid"><path class="iso-fill" d="M359.3 287.8L359.6 286.8L360.2 285.8L361.1 284.9L362.3 284.3L363.7 283.7L365.2 283.5L366.7 283.4L368.3 283.6L369.7 284L371 284.6L372.1 285.4L372.8 286.3L373.2 287.3L373.3 288.4L373.3 289.6L373 290.6L372.4 291.6L371.5 292.5L370.3 293.1L368.9 293.7L367.4 293.9L365.9 294L364.3 293.8L362.9 293.4L361.6 292.8L360.5 292L359.8 291.1L359.4 290.1L359.3 289Z"/><path class="iso-shade" data-shade="0" d="M373.3 289.6L373 290.6L373 289.4L373.3 288.4ZM373 290.6L3
