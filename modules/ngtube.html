頭</button><button type="button" data-step="4" aria-pressed="false">④ 気管なら</button><button type="button" data-step="5" aria-pressed="false">⑤ 胃へ</button><button type="button" data-step="6" aria-pressed="false">⑥ 確認</button><button type="button" data-step="7" aria-pressed="false">⑦ 固定</button></div></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>栄養チューブ（8 Fr、外径約2.7 mm）。赤い帯は測った長さ（NEMU）の印</span><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>気管に入ったときは赤で示す</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>生後3か月・5.8 kgを想定した厚さ4 cmの正中矢状断スライス模型。仰臥位（寸法は図のための想定）</span></span><span class="iso-caption">子どもでは鼻先→耳朶→剣状突起と臍の中間（NEMU）で長さを測り、印をつける。乳児は仰臥位で頭を正中にし、包み込んで動かないようにする（首を反らさない）。鼻腔底に沿って顔に垂直に入れ、おしゃぶりやショ糖で吸啜・嚥下を促して進める。むせ・チアノーゼ・SpO₂低下があれば気管を疑ってすぐ戻す。気泡音では判断せず、吸引液のpHを施設の基準で確かめ、はっきりしなければX線で確かめてから使う。</span></figcaption></figure></section><section data-fig="2"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 2</span><span class="iso-plate-corner" data-corner="title">術者の視点</span><span class="iso-plate-corner" data-corner="hint">ドラッグで手技を進める・部位にふれると名前</span><span class="iso-plate-corner" data-corner="readout" data-readout>準備 · 仰臥位で包み込み、顔と鼻孔を見る</span></div><div class="iso-stage" tabindex="0" role="slider" aria-label="術者の視点：矢印キーで手技の段階を進める" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 620 470" role="img" aria-label="術者の視点：仰臥位の赤ちゃんの横に立ち、やや上から顔を見る。見えるの ata-step="5" aria-pressed="false">⑤ 胃へ</button><button type="button" data-step="6" aria-pressed="false">⑥ 確認</button><button type="button" data-step="7" aria-pressed="false">⑦ 固定</button></div><div class="iv-row"><button type="button" class="iv-xray" aria-pressed="false">体内を透視</button><span class="iv-note">実際には見えない部分を半透明で表示</span></div></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>手元のチューブと印：印が鼻孔に来るまで送る。入った長さは鼻孔の目盛りで読む</span><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>むせ・咳込み・チアノーゼ・SpO₂低下：気管に入った合図（赤）</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>鼻の奥から先のチューブは見えない（「体内を透視」で表示）</span></span><span class="iso-caption">術者の目に入るのは、赤ちゃんの顔と鼻孔、手元のチューブと印、シリンジと試験紙、そして反応（吸う・飲み込む動き、むせ、顔色、SpO₂）だけで、鼻の奥から先のチューブは見えない。保護者には頭のそばで声をかけてもらう。吸啜・嚥下に合わせて送り、むせや顔色の変化があればすぐ咽頭まで戻す。印が鼻孔に来たら止め、吸引液のpHを施設の基準で確かめ、はっきりしなければX線で先端を確かめてから使う。</span></figcaption></figure></section></main></div></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
