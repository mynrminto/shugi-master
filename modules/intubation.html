tep="8" aria-pressed="false">⑧ 固定</button></div></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>気管チューブ（内径4.5 mm、カフ付き）</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>マッキントッシュ型喉頭鏡（ブレード2号）</span><span class="iso-key"><svg class="iso-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>点線：④口から声門への視線</span><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>気道（空気の通り道）</span></span><span class="iso-caption">4歳児（15 kg の想定）の頭頸部の左半分を外した正中断面モデル。ブレード（マッキントッシュ型2号）を舌に沿わせて入れ、先端を喉頭蓋谷に置き、ハンドルの軸の方向へ持ち上げると、舌と喉頭蓋が前へ移り声門が見える。内径4.5 mmのカフ付きチューブを、カフ全体が声帯を越えるまで進めてスタイレットを抜き、門歯13.5 cm（内径の約3倍）でカフを膨らませる（20 cmH₂O 未満）。位置は波形カプノグラフィで確かめる。器具は実寸、解剖の寸法は図のための想定値。</span></figcaption></figure></section><section data-fig="2"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 2</span><span class="iso-plate-corner" data-corner="title">術者の視点</span><span class="iso-plate-corner" data-corner="hint">ドラッグで手技を進める・部品にふれると名前</span><span class="iso-plate-corner" data-corner="readout" data-readout>器具の点検 · ライト・カフ・吸引を確かめる</span></div><div class="iso-stage" tabindex="0" role="slider" aria-label="術者の視点：矢印キーで手技の段階を進める" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 620 638" role="img" aria-label="術者の視点。頭側に立ち、額の上から口の中をのぞき込む。開口すると見えるのは舌と歯だけで、喉頭鏡で舌を左へ寄せて持ち上げると喉頭蓋、続いて声門が見える。チューブはカフが声帯を越えるところまで目で追い、そのあとはパイロットバルーン、モニターの波形、門歯の目盛りを見て確かめる。"><g transform an class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>チューブ：カフが声帯を越えるまで目で追う</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>頭の中（断面）：術者には見えない部分</span></span><span class="iso-caption">術者は頭側に立ち、額の上から口の中をのぞき込む。子どもの口は小さく、開口しただけでは舌と歯しか見えない。ブレードで舌を左へ寄せ、先端を喉頭蓋谷に置いて柄の軸方向へ持ち上げると、喉頭蓋、続いて声門が見えてくる。声門が見えないままチューブを進めない。チューブは右口角から入れ、カフが声帯を越えるところまで目で追う。そこから先の気管の中は見えないので、位置は門歯の目盛り、両側の胸の動き、波形カプノグラフィで確かめる。</span></figcaption></figure></section></main></div></main><script type="module">const AZIMUTH = 45;
