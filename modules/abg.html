拍動を触れ、抜いたら圧迫する</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>黒いキャップ：気泡を抜いてから先端を密封する</span></span><span class="iso-caption">14歳・38 kgの子の左の手関節。刺す所に局所麻酔をして、手関節を軽く背屈させ、2本の指で触れた橈骨動脈の拍動の延長線上を45°で刺す。通気フィルター付きの血液ガス用シリンジは、針先が動脈に入ると動脈圧で自然に満ちる。抜いたら5分以上圧迫する。先端を上にして気泡を押し出し、キャップで密封して転がして混ぜる。プラスチックのシリンジは氷に入れず、室温で30分以内に測定する（PO2を見るならなるべく早く）。採る量は測定器に要る最小限にする。目盛り・量・深さは一例。</span></figcaption></figure></section><section data-fig="2"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 2</span><span class="iso-plate-corner" data-corner="title">術者の視点</span><span class="iso-plate-corner" data-corner="hint">ドラッグで手技を進める・部品にふれると名前</span><span class="iso-plate-corner" data-corner="readout" data-readout>準備 · 押し子を0.6 mLに合わせて置く</span></div><div class="iso-stage" tabindex="0" role="slider" aria-label="術者の視点：矢印キーで手技の段階を進める" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg f2svg" viewBox="0 0 620 470" role="img" aria-label="術者の視点。手袋の指が来る側から手関節のパッドを見下ろす。見えるのは皮膚の表面、拍動を触れる2本の指、皮膚の外に出た針とシリンジだけで、皮膚の下の針先と橈骨動脈は見えない。針先が動脈に入ったことは、シリンジに血液が満ちて押し子が戻ることでわかる。"><defs><clipPath id="f2-fillA"><path data-part="fillA" d="M0 0Z"/></clipPath><clipPath id="f2-so"><path d="M2821.2 4510.5L7127.5 1969.5L2045.5 -6642.9L-2260.7 -4102Z"/></clipPath><clipPath id="f2-si"><path d="M2821.2 4510.5L-1485 7051.4L-6566.9 -1561L-2260.7 -4102Z"/></clipPath></defs><g data-name="base"><path class="iso-halo" d="M-17.3 385.9L-16.4 382.3L66.5 175.2L68.4 171.8L71.3 168.7L75 166.1L79.4 164L84.4 162.5L89.7 161.6L95.1 161.5L100.5 162.1L642 259.2L647.1 260.5L651.7 262.4L655.7 264.9L658.9 267.8L661.1 271.2L662.3 274.7L662.5 278.3L662.5 305.8L661.6 309.4L578.7 516.5L576.8 519.9L573.9 522.9L570.2 525.6L565.8 527.7L560.8 529 // 1 拍の形：収縮期に速く広がり、ゆっくり戻る

let t = 0, target = 0, frame = 0, last = 0, visible = false, dragging = false;
