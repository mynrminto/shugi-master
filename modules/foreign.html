@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}

.iso-figure{margin:32px 0 36px}

.iso-plate .iso-svg{margin:0 auto}

.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

*{box-sizing:border-box}

body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

h class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>マッキントッシュ型2号（約98 mm）・小児用マギール鉗子（全長約20 cm）：一例</span><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>異物で閉塞している部位</span><span class="iso-key"><svg class="iso-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>異物が取れたあとの空気の流れ</span></span><span class="iso-caption">3歳・14 kgの子どもの頭頸部を正中で切った模型。反応がない窒息では、まず胸骨圧迫からCPRを始める。訓練を受けた人は、喉頭鏡で喉頭展開して異物が見えれば、マギール鉗子で取り出してよい。鉗子は右口角からブレードに沿って閉じたまま進め、異物の約2 cm手前で開いて囲み、つかんだら異物から目を離さずに引き出す。喉頭蓋や咽頭の粘膜をつままない。取れたら声門まで見直し、換気と呼吸を確かめる。子どもの体の形と寸法は図のための近似。</span></figcaption></figure></section><section data-fig="2"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 2</span><span class="iso-plate-corner" data-corner="title">術者の視点</span><span class="iso-plate-corner" data-corner="hint">ドラッグで手技を進める・部品にふれると名前</span><span class="iso-plate-corner" data-corner="readout" data-readout>口の中は見えない · 反応がなければCPR</span></div><div class="iso-stage" tabindex="0" role="slider" aria-label="術者の視点：矢印キーで手技の段階を進める" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 620 668" role="img" aria-label="術者の視点。頭側に立ち、額の上から口の中をのぞき込む。喉頭鏡を入れる前は口の中しか見えない。舌を左へ寄せて喉頭蓋谷で持ち上げると、喉頭蓋の奥に異物が見える。鉗子は右口角からブレードに沿わせ、先端を視野の中に置いたまま異物をつかんで引き出し、最後に声門まで見る。"><g data-name="base"><path class="iso-halo" d="M16.3 460.8L16.4 458.9L17 457.1L18 455.4L250.6 139.7L251.9 138.3L253.6 137L255.5 136.1L257.6 135.5L259.8 135.2L262 135.4L264.2 135.9L266.1 136.7L598.4 312.8L600.2 313.9L601.6 315.3L602.7 317L603.4 318.7L603.7 320.6L603.7 326.6L603.6 328.5L603 330.3L602 332L369.4 647.6L368.1 649.1L366.4 650.3L364.5 651.3L362.4 651.9L360.2 652.1L358 652L355.8 651.5L353.9 650.7L21.6 474.6L19.8 473.4L18.4 472L17.3 470.4L16.6 468.6L16.3 466.8Z"/><g class="iso-solid"><path class="iso-fill ら外れたら進めない。引き出すあいだも異物から目を離さず、最後に声門まで見て残りがないことを確かめる。見えない異物を手探りでつかもうとしない。</span></figcaption></figure></section></main></div></main><script type="module">const AZIMUTH = 45;

const tenth = (value) => {
